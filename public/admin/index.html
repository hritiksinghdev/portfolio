<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Admin Dashboard</title>
  <style>
    :root {
      --bg: #0b1120;    
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --input-bg: #0f172a;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Loading Overlay */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Login Container */
    #loginContainer {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }
    .login-box h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: -0.025em;
    }
    .login-box p {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.875rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
      font-size: 1rem;
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--primary);
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1rem;
    }
    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.875rem;
      margin-top: 1rem;
      text-align: center;
      min-height: 1.25rem;
    }

    /* Dashboard Container */
    #dashboardContainer {
      display: none;
      flex-direction: column;
      flex: 1;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px var(--primary);
    }
    #logoutBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
      font-weight: 500;
    }
    #logoutBtn:hover {
      background: var(--input-bg);
      color: var(--text);
      border-color: var(--text-muted);
    }
    
    .content {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: var(--surface);
      border-radius: 1rem;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .card-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header h2 {
      font-size: 1.125rem;
      font-weight: 500;
    }
    .refresh-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
      font-weight: 500;
    }
    .refresh-btn:hover:not(:disabled) {
      background: var(--border);
    }
    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Table Responsive */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem 1.5rem;
      white-space: nowrap;
    }
    th {
      background: rgba(0,0,0,0.2);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tr:last-child {
      border-bottom: none;
    }
    tbody tr:hover {
      background: rgba(255,255,255,0.02);
    }
    
    /* Cell styling */
    td {
      font-size: 0.875rem;
      color: var(--text);
    }
    .td-name {
      font-weight: 500;
      color: #fff;
    }
    .td-email {
      color: var(--text-muted);
    }
    .td-message {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
    }
    .td-date {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
    }
    .empty-state p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 1rem;
    }
    
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .badge-primary { 
      background: rgba(59, 130, 246, 0.1); 
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.2);
    }
    .badge-gray { 
      background: rgba(148, 163, 184, 0.1); 
      color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.2);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Loading State -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="margin-top: 1rem; color: var(--text-muted); font-size: 0.875rem; font-weight: 500;">Authenticating...</div>
  </div>

  <!-- Login Dashboard -->
  <div id="loginContainer">
    <div class="login-box">
      <h2>Admin Control</h2>
      <p>Sign in to manage service requests</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="admin@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" id="loginBtn">Sign In</button>
        <div class="error-msg" id="loginError"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardContainer">
    <header>
      <h1><span class="logo-dot"></span> Admin Dashboard</h1>
      <button id="logoutBtn">Log out</button>
    </header>
    <main class="content">
      <div class="card">
        <div class="card-header">
          <h2>Service Requests</h2>
          <button class="refresh-btn" id="refreshBtn">Refresh Data</button>
        </div>
        <div class="table-responsive">
          <table id="requestsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Service</th>
                <th>Message</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Rows JS payload -->
            </tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" style="display: none;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto; color: var(--border);">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <p>No service requests found.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script type="module" src="/admin/supabaseClient.js"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
